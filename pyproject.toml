[project]
name = "discogs-mcp-server"
version = "0.1.0"
description = "MCP server for the Discogs API (Python)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
discogs-mcp-server = "discogs_mcp_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
